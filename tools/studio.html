<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fangbound studio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b24; overflow: hidden; }
    canvas#c { display: block; width: 100vw; height: 100vh; }
    #arena { position: fixed; inset: 0; }
    body.portrait { background: transparent; }
  </style>
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body>
  <script type="module">
    // Dev and render page.
    //   ?view=arena&ids=a,b,c,d,e,f   six monsters in the arena
    //   ?view=grid                    every monster on the lobby pedestal
    //   ?view=portrait                window.studio.portrait(id) → PNG data URL
    //   ?view=hero                    the landing-page loop; window.studio.seek(t)
    //   &theme=halloween              the Night of Fangs look (costumes, haunted arena)
    // Math.random is seeded so renders come out the same every time.
    const theme = new URLSearchParams(location.search).get('theme');
    if (theme) document.documentElement.dataset.event = theme;
    let seed = 20261029;
    Math.random = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const { createStage } = await import('/src/three/stage.js');
    const { buildMonster, buildEgg, MONSTER_IDS } = await import('/src/three/monsters.js');
    const { formation } = await import('/src/three/formation.js');
    const { create3dView } = await import('/src/battle3d.js');

    const q = new URLSearchParams(location.search);
    const view = q.get('view') || 'arena';
    const studio = { ids: MONSTER_IDS };

    if (view === 'hero') {
      const L = 12;
      const arena = document.createElement('div');
      arena.id = 'arena';
      document.body.appendChild(arena);
      // Night of Fangs puts Hollowjack in the squad.
      const team = theme === 'halloween' ? { a: ['cindertusk', 'hollowjack', 'geowl'], b: ['shellguard', 'joltcub', 'mistling'] } : { a: ['cindertusk', 'flarefox', 'geowl'], b: ['shellguard', 'joltcub', 'mistling'] };
      const start = ['a', 'b'].flatMap((side) => team[side].map((id, slot) => ({ uid: side + slot, id, side, slot, level: 5, maxHp: 1000, hp: 1000, mana: 0 })));
      const v = create3dView(arena, { start }, { hud: false, quality: 'high', lockCamera: true });
      const tall = innerWidth < innerHeight;
      const cast = { t: 0 };
      // [time, action]: a scripted skirmish that is over before the loop wraps.
      const beats = [
        [0.7, () => v.attack({ src: 'a1', tgt: 'b0' })], [0.7, () => v.damage({ src: 'a1', tgt: 'b0', kind: 'hit' })],
        [1.9, () => v.attack({ src: 'b1', tgt: 'a0' })], [1.9, () => v.damage({ src: 'b1', tgt: 'a0', kind: 'hit' })],
        [3.1, () => v.cast({ src: 'b1' })], [3.1, () => v.damage({ src: 'b1', tgt: 'a0', kind: 'hit' }, cast)], [3.1, () => v.damage({ src: 'b1', tgt: 'a1', kind: 'hit' }, cast)],
        [4.5, () => v.cast({ src: 'a0' })], [4.5, () => v.damage({ src: 'a0', tgt: 'b0', kind: 'hit', crit: true }, cast)],
        [5.9, () => v.attack({ src: 'a2', tgt: 'b1' })], [5.9, () => v.damage({ src: 'a2', tgt: 'b1', kind: 'hit' })],
        [6.9, () => v.cast({ src: 'b2' })], [6.9, () => v.heal({ tgt: 'b0' })], [6.9, () => v.heal({ tgt: 'b1' })],
        [8.0, () => v.cast({ src: 'a2' })], [8.0, () => { v.shield({ tgt: 'a0' }); v.bars('a0', { sh: 100 }); }],
        [9.1, () => v.cast({ src: 'a1' })], [9.1, () => v.damage({ src: 'a1', tgt: 'b2', kind: 'hit', crit: true }, cast)],
        [10.3, () => v.attack({ src: 'b0', tgt: 'a0' })], [10.3, () => v.damage({ src: 'b0', tgt: 'a0', kind: 'hit' })],
        [11.0, () => v.bars('a0', { sh: 0 })],
      ];
      let last = -1;
      const camAt = (t) => {
        const w = (Math.PI * 2 * t) / L;
        if (tall) return { pos: [Math.sin(w) * 2.4, 5.4 + Math.sin(w * 2) * 0.4, 13.2 + Math.cos(w) * 0.8], target: [0, 1.4, -0.6], fov: 48, sway: 0 };
        const th = -0.3 + 0.32 * Math.sin(w);
        const r = 10.6 + 1.1 * Math.cos(w);
        return { pos: [Math.sin(th) * r, 2.5 + 0.45 * Math.sin(w * 2), Math.cos(th) * r], target: [Math.sin(th) * 0.6, 1.05, 0], fov: 31, sway: 0 };
      };
      studio.duration = L;
      studio.view = v;
      studio.seek = (t) => {
        const tt = ((t % L) + L) % L;
        if (tt < last) last = -1;
        for (const [at, fn] of beats) if (at > last && at <= tt) { v.setTime(at); fn(); }
        last = tt;
        v.stage.setView(camAt(tt));
        v.setTime(tt);
        v.frame(tt);
      };
    } else {
      const canvas = document.createElement('canvas');
      canvas.id = 'c';
      document.body.appendChild(canvas);
      const stage = createStage(canvas, { mode: view === 'arena' ? 'arena' : view === 'portrait' ? 'studio' : 'pedestal', quality: 'high', preserve: true });
      const fit = () => stage.resize(innerWidth, innerHeight);
      addEventListener('resize', fit);
      fit();
      if (view === 'arena') {
        const ids = (q.get('ids') || 'cindertusk,joltcub,sproutling,shellguard,riptide,mistling').split(',');
        const f = formation(innerWidth < innerHeight ? 'portrait' : 'landscape');
        ids.forEach((id, i) => {
          const rig = buildMonster(id);
          const slot = f[i < 3 ? 'a' : 'b'][i % 3];
          rig.root.position.set(...slot.pos);
          rig.root.rotation.y = slot.yaw;
          stage.add(rig);
        });
        stage.setView(f.camera);
      } else if (view === 'grid') {
        MONSTER_IDS.forEach((id, i) => {
          const rig = buildMonster(id);
          rig.root.position.set((i % 5) * 2.3 - 4.6, 0, Math.floor(i / 5) * 2.6 - 2.6);
          rig.root.rotation.y = -0.55;
          stage.add(rig);
        });
        stage.setView({ pos: [0, 7.5, 13], target: [0, 0.6, 0], fov: 38, sway: 0 });
      }
      let current = null;
      studio.seek = (t) => stage.render(t);
      // A 3/4 portrait of one monster (or the egg) on a transparent background.
      studio.portrait = async (id, t = 0.6, evo = false) => {
        const THREE = await import('three');
        if (current) stage.remove(current);
        current = id === 'egg' ? buildEgg() : buildMonster(id, { evo });
        current.root.rotation.y = id === 'egg' ? 0 : -0.62;
        current.root.remove(current.shadowBlob);
        // Additive glows onto a transparent canvas need their alpha written too.
        current.root.traverse((o) => {
          if (o.isSprite || o.userData.ground) o.visible = false;
          const m = o.material;
          if (m && m.blending === THREE.AdditiveBlending) {
            Object.assign(m, { blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
            m.needsUpdate = true;
          }
        });
        stage.add(current);
        current.tick(t);
        current.root.updateMatrixWorld(true);
        // Frame the model's bounds, so small and large monsters fill the picture alike.
        const box = new THREE.Box3();
        current.body.traverse((o) => { if (o.isMesh && !o.material.isShaderMaterial) box.expandByObject(o); });
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const fov = 26;
        const dist = (Math.max(size.y, size.x * 0.8, size.z * 0.8) / 2 / Math.tan((fov * Math.PI) / 360)) * 1.32;
        const dir = new THREE.Vector3(0.18, 0.3, 1).normalize();
        stage.setView({ pos: center.clone().addScaledVector(dir, dist).toArray(), target: center.toArray(), fov, sway: 0 });
        stage.render(t);
        return canvas.toDataURL('image/png');
      };
      if (view !== 'portrait' && !q.has('still')) {
        const loop = (now) => { stage.render(now / 1000); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
    }
    if (view === 'hero' && !q.has('still')) {
      const loop = (now) => { studio.seek(now / 1000); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    window.studio = studio;
    window.studioReady = true;
  </script>
</body>
</html>
